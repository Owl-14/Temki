<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки — Инкубатор</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css?v=15">
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="scene__heat"></div>
    <div class="scene__grid"></div>
    <div class="scene__egg scene__egg--1"></div>
    <div class="scene__egg scene__egg--2"></div>
    <div class="scene__orb scene__orb--1"></div>
    <div class="scene__orb scene__orb--2"></div>
  </div>

  <nav class="nav">
    <div class="nav__brand">
      <span class="online-counter__heat" id="online-heat" hidden aria-hidden="true"></span>
      <a class="nav__logo" href="index.html">
        <svg class="nav__icon" viewBox="0 0 24 28" aria-hidden="true">
          <ellipse cx="12" cy="15" rx="9" ry="12" fill="none" stroke="url(#egg-grad)" stroke-width="1.5"/>
          <ellipse cx="12" cy="15" rx="5" ry="7" fill="url(#egg-glow)" opacity="0.35"/>
          <defs>
            <linearGradient id="egg-grad" x1="0" y1="0" x2="24" y2="28">
              <stop offset="0%" stop-color="#fbbf24"/>
              <stop offset="100%" stop-color="#fb923c"/>
            </linearGradient>
            <radialGradient id="egg-glow" cx="50%" cy="60%">
              <stop offset="0%" stop-color="#fb923c"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
          </defs>
        </svg>
        Инкубатор
      </a>
      <p class="online-counter__text" id="online-text" hidden>тут щас <strong>0</strong></p>
    </div>
    <div class="nav__actions" id="nav-auth-slot"></div>
  </nav>

  <main class="page page--narrow">
    <header class="page__header">
      <h1 class="page__title" id="settings-title">Настройки профиля</h1>
      <p class="page__lead">Имя, юзернейм, аватар и описание</p>
    </header>

    <p class="form-message" id="settings-message" hidden></p>

    <form class="form" id="settings-form" novalidate>
      <div class="form__avatar-row">
        <div class="avatar-preview" id="avatar-preview">
          <span class="avatar-placeholder" aria-hidden="true"></span>
        </div>
        <label class="btn btn--warm form__file-btn">
          <span class="btn__text">Загрузить аватар</span>
          <input type="file" id="avatar-input" accept="image/*" hidden>
        </label>
      </div>

      <label class="form__field">
        <span class="form__label">Имя</span>
        <input class="form__input" type="text" name="displayName" maxlength="40">
        <span class="form__hint">любые символы, эмодзи — до 40</span>
      </label>
      <label class="form__field">
        <span class="form__label">Юзернейм</span>
        <input class="form__input" type="text" name="username" maxlength="20" autocapitalize="off" spellcheck="false">
        <span class="form__hint">латиница, цифры, _ — от 3 до 20</span>
      </label>
      <label class="form__field">
        <span class="form__label">О себе</span>
        <textarea class="form__input form__textarea" name="bio" maxlength="280" rows="4"></textarea>
      </label>

      <button class="btn btn--primary form__submit" type="submit">
        <span class="btn__shine" aria-hidden="true"></span>
        <span class="btn__text">Сохранить</span>
      </button>

      <button class="btn btn--ghost form__secondary" type="button" id="reset-password-btn">
        Сбросить пароль по email
      </button>
    </form>
  </main>

  <footer class="footer">
    <p>Инкубатор — греем яйца до вылупления</p>
  </footer>

  <script src="../config/firebase.config.js?v=2"></script>
  <script src="../assets/vendor/analytics.config.js?v=5"></script>
  <script src="../assets/vendor/analytics.js?v=5"></script>
  <script type="module" src="../assets/js/core/presence.js?v=1"></script>
  <script type="module" src="../assets/js/pages/settings.js?v=2"></script>
</body>
</html>
