<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль — Инкубатор</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="scene__heat"></div>
    <div class="scene__grid"></div>
    <div class="scene__egg scene__egg--1"></div>
    <div class="scene__egg scene__egg--2"></div>
    <div class="scene__orb scene__orb--1"></div>
    <div class="scene__orb scene__orb--2"></div>
  </div>

  <nav class="nav">
    <div class="nav__brand">
      <span class="online-counter__heat" id="online-heat" hidden aria-hidden="true"></span>
      <a class="nav__logo" href="index.html">
        <svg class="nav__icon" viewBox="0 0 24 28" aria-hidden="true">
          <ellipse cx="12" cy="15" rx="9" ry="12" fill="none" stroke="url(#egg-grad)" stroke-width="1.5"/>
          <ellipse cx="12" cy="15" rx="5" ry="7" fill="url(#egg-glow)" opacity="0.35"/>
          <defs>
            <linearGradient id="egg-grad" x1="0" y1="0" x2="24" y2="28">
              <stop offset="0%" stop-color="#fbbf24"/>
              <stop offset="100%" stop-color="#fb923c"/>
            </linearGradient>
            <radialGradient id="egg-glow" cx="50%" cy="60%">
              <stop offset="0%" stop-color="#fb923c"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
          </defs>
        </svg>
        Инкубатор
      </a>
      <p class="online-counter__text" id="online-text" hidden>тут щас <strong>0</strong></p>
    </div>
    <div class="nav__actions" id="nav-auth-slot"></div>
  </nav>

  <main class="page">
    <div id="profile-not-found" class="empty-state" hidden>
      <h1 class="page__title">Профиль не найден</h1>
      <p class="page__lead">Такого юзернейма нет в инкубаторе</p>
      <a class="btn btn--warm" href="index.html">На главную</a>
    </div>

    <div id="profile-view">
      <header class="profile-header">
        <div class="profile-header__avatar" id="profile-avatar">
          <span class="avatar-placeholder avatar-placeholder--large" aria-hidden="true"></span>
        </div>
        <div class="profile-header__info">
          <h1 class="profile-header__name" id="profile-name"></h1>
          <p class="profile-header__username" id="profile-username"></p>
          <p class="profile-header__bio" id="profile-bio"></p>
          <div class="profile-header__actions" id="profile-actions"></div>
        </div>
      </header>

      <section class="profile-eggs">
        <h2 class="section-header__title">Яйца</h2>
        <div class="eggs" id="profile-eggs"></div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <p>Инкубатор — греем яйца до вылупления</p>
  </footer>

  <script src="effects.js?v=7"></script>
  <script src="firebase.config.js?v=2"></script>
  <script src="analytics.config.js?v=5"></script>
  <script src="analytics.js?v=5"></script>
  <script type="module" src="js/presence.js?v=1"></script>
  <script type="module" src="js/pages/profile.js?v=4"></script>
</body>
</html>
